  <script type="text/babel">
    const { useState, useEffect, useRef, useContext, createContext, useMemo } = React;

    /* =====================

       ===================== */
    const DAY = {
      accent:         "rgb(174, 106, 56)",
      text:           "rgb(66, 49, 34)",
      textDark:       "rgb(50, 34, 20)",
      textMuted:      "rgb(138, 108, 78)",
      textLight:      "rgb(168, 138, 108)",
      textBody:       "rgb(100, 74, 50)",
      border:         "rgb(218, 192, 162)",
      tagBg:          "rgba(174, 106, 56, 0.09)",
      tagBorder:      "rgba(174, 106, 56, 0.35)",
      dot:            "rgb(200, 168, 132)",
      cardBg:         "rgb(255, 250, 244)",
      bgNavScrolled:  "rgba(250, 225, 195, 0.9)",
      bg:             "rgb(250, 225, 195)",
    };
    const NIGHT = {
      accent:         "rgb(200, 140, 80)",
      text:           "rgb(220, 195, 165)",
      textDark:       "rgb(250, 225, 195)",
      textMuted:      "rgb(180, 148, 112)",
      textLight:      "rgb(130, 100, 72)",
      textBody:       "rgb(195, 166, 134)",
      border:         "rgb(65, 46, 30)",
      tagBg:          "rgba(200, 140, 80, 0.13)",
      tagBorder:      "rgba(200, 140, 80, 0.4)",
      dot:            "rgb(120, 90, 62)",
      cardBg:         "rgb(36, 25, 15)",
      bgNavScrolled:  "rgba(28, 18, 10, 0.92)",
      bg:             "rgb(28, 18, 10)",
    };
    const ColorCtx = createContext(DAY);

    /* =====================
       RESUME DATA — edit here
       ===================== */
    const DATA = {
      name: "Joe Graham",
      title: "Software Engineer",
      tagline: "Building things at the intersection of hardware and software.",
      contact: {

        github: "JoeGLT04",

      },
      about:
        "Add a short professional bio here. Describe your background, what you enjoy building, and what you are looking for next.",
      experience: [

          ],
        },
      ],

      },

        },
      ],
      projects: [
        {

          description:
            "Real-time IMU-based angle measurement using the BMI270 on an Arduino Nano 33 BLE. Implements sensor fusion (AHRS / complementary filter) and streams data over BLE Nordic UART Service to a host computer.",
          tech: ["C++ (Arduino)", "BLE / NUS", "Python", "IMU Sensor Fusion"],
          link: "https://github.com/JoeGLT04",
        },
        {
          name: "OpenGL Renderer",
          description:
            "Custom OpenGL 4.1 3D renderer on macOS. Reads live IMU data from a named pipe fed by a BLE relay script to animate a 3D model in real time.",
          tech: ["C++", "OpenGL 4.1", "Python", "BLE"],
          link: "https://github.com/JoeGLT04",
        },
        {

          tech: ["Tech 1", "Tech 2"],
          link: null,
        },
      ],
    };

    /* =====================
       SHARED CARD STYLE
       ===================== */
    const makeCard = (C) => ({
      background: C.cardBg,
      border: `1px solid ${C.border}`,
      borderRadius: "12px",
      padding: "24px",
      marginBottom: "16px",
      boxShadow: "0 1px 4px rgba(66, 49, 34, 0.07)",
    });

    /* =====================
       BACKGROUND CANVAS
       ===================== */
    const BackgroundCanvas = ({ night }) => {
      const canvasRef = useRef(null);
      const nightRef = useRef(night);
      useEffect(() => { nightRef.current = night; }, [night]);

      useEffect(() => {
        const canvas = canvasRef.current;
        // Use alpha:false — opaque canvas, cream bg painted in display shader
        const cfg = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false };
        let gl = canvas.getContext('webgl2', cfg);
        const isGL2 = !!gl;
        if (!gl) gl = canvas.getContext('webgl', cfg) || canvas.getContext('experimental-webgl', cfg);
        if (!gl) return;

        // Half-float setup
        let HF;
        if (isGL2) {
          gl.getExtension('EXT_color_buffer_float');
          HF = gl.HALF_FLOAT;
        } else {
          const ext = gl.getExtension('OES_texture_half_float');
          if (!ext) return;
          gl.getExtension('OES_texture_half_float_linear');
          HF = ext.HALF_FLOAT_OES;
        }

        // Format detection
        function testFmt(ifmt, fmt) {
          const t = gl.createTexture();
          gl.bindTexture(gl.TEXTURE_2D, t);
          gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, 4, 4, 0, fmt, HF, null);
          const f = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, f);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
          const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
          gl.deleteFramebuffer(f); gl.deleteTexture(t);
          return ok;
        }
        let FMT_RGBA, FMT_RG, FMT_R;
        if (isGL2) {
          FMT_RGBA = testFmt(gl.RGBA16F, gl.RGBA) ? { i: gl.RGBA16F, f: gl.RGBA } : { i: gl.RGBA, f: gl.RGBA };
          FMT_RG   = testFmt(gl.RG16F,   gl.RG)   ? { i: gl.RG16F,   f: gl.RG   } : FMT_RGBA;
          FMT_R    = testFmt(gl.R16F,    gl.RED)   ? { i: gl.R16F,    f: gl.RED  } : FMT_RG;
        } else {
          FMT_RGBA = FMT_RG = FMT_R = { i: gl.RGBA, f: gl.RGBA };
        }

        // Config — matching library defaults
        const SIM = 128, DYE = 512, DT = 1/60;
        const CURL_V = 1.9, SWIRL = 4, PRESSURE = 0.8;
        const VEL_DISS = 0.98, DYE_DISS = 0.96, FORCE = 1.1, RADIUS = 0.3 / 100;

        // Fluid color: day = dark brown→light brown, night = amber→cream
        function fluidColor(angle) {
          const t = Math.sin(angle) * 0.5 + 0.5;
          if (nightRef.current) {
            // Night: rgb(174,106,56) → rgb(250,225,195)
            return [
              (174 + t * (250 - 174)) / 255,
              (106 + t * (225 - 106)) / 255,
              (56  + t * (195 - 56))  / 255,
            ];
          }
          // Day: rgb(66,49,34) → rgb(174,106,56)
          return [
            (66  + t * (174 - 66))  / 255,
            (49  + t * (106 - 49))  / 255,
            (34  + t * (56  - 34))  / 255,
          ];
        }

        // Shader compile
        function compile(type, src) {
          const s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error('[fluid]', gl.getShaderInfoLog(s));
          return s;
        }
        function mkProg(vs, fs) {
          const p = gl.createProgram();
          gl.bindAttribLocation(p, 0, 'position');
          gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
          gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error('[fluid]', gl.getProgramInfoLog(p));
          const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
          for (let i = 0; i < n; i++) { const nm = gl.getActiveUniform(p, i).name; u[nm] = gl.getUniformLocation(p, nm); }
          return { p, u, use() { gl.useProgram(this.p); } };
        }

        // Vertex shaders — two variants matching library's USE_V_UV / USE_OFFSETS defines
        const V_UV = `attribute vec2 position; varying vec2 vUv;
          void main(){ vUv=position*0.5+0.5; gl_Position=vec4(position,0.0,1.0); }`;
        const V_UV_OFF = `attribute vec2 position; varying vec2 vUv,vL,vR,vT,vB; uniform vec2 texelSize;
          void main(){
            vUv=position*0.5+0.5;
            vL=vUv-vec2(texelSize.x,0.); vR=vUv+vec2(texelSize.x,0.);
            vT=vUv+vec2(0.,texelSize.y); vB=vUv-vec2(0.,texelSize.y);
            gl_Position=vec4(position,0.0,1.0); }`;

        // Fragment shaders — exact copies from local lib/glsl/ files
        const F_ADV = `precision highp float;
          varying vec2 vUv; uniform sampler2D uVelocity,uSource; uniform vec2 texelSize; uniform float dt,uDissipation;
          void main(){
            vec2 coord=vUv-dt*texture2D(uVelocity,vUv).xy*texelSize;
            gl_FragColor=uDissipation*texture2D(uSource,coord);
            gl_FragColor.a=1.0; }`;

        const F_CLEAR = `precision highp float;
          varying vec2 vUv; uniform sampler2D uTexture; uniform float uClearValue;
          void main(){ gl_FragColor=uClearValue*texture2D(uTexture,vUv); }`;

        const F_SPLAT = `precision highp float;
          varying vec2 vUv; uniform sampler2D uTarget; uniform float aspectRatio,uRadius;
          uniform vec3 uColor; uniform vec2 uPointer;
          void main(){
            vec2 p=vUv-uPointer; p.x*=aspectRatio;
            vec3 splat=exp(-dot(p,p)/uRadius)*uColor;
            gl_FragColor=vec4(texture2D(uTarget,vUv).xyz+splat,1.0); }`;

        const F_CURL = `precision highp float;
          varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uVelocity;
          void main(){
            float L=texture2D(uVelocity,vL).y, R=texture2D(uVelocity,vR).y;
            float T=texture2D(uVelocity,vT).x, B=texture2D(uVelocity,vB).x;
            gl_FragColor=vec4(R-L-T+B,0.0,0.0,1.0); }`;

        const F_VORT = `precision highp float;
          varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uVelocity,uCurl; uniform float uCurlValue,dt;
          void main(){
            float L=texture2D(uCurl,vL).x, R=texture2D(uCurl,vR).x;
            float T=texture2D(uCurl,vT).x, B=texture2D(uCurl,vB).x, C=texture2D(uCurl,vUv).x;
            vec2 force=vec2(abs(T)-abs(B),abs(R)-abs(L))*0.5;
            force/=length(force)+1.0; force*=uCurlValue*C; force.y*=-1.0;
            gl_FragColor=vec4(texture2D(uVelocity,vUv).xy+force*dt,0.0,1.0); }`;

        const F_DIV = `precision highp float;
          varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uVelocity;
          void main(){
            float L=texture2D(uVelocity,vL).x, R=texture2D(uVelocity,vR).x;
            float T=texture2D(uVelocity,vT).y, B=texture2D(uVelocity,vB).y;
            vec2 C=texture2D(uVelocity,vUv).xy;
            if(vL.x<0.0)L=-C.x; if(vR.x>1.0)R=-C.x; if(vT.y>1.0)T=-C.y; if(vB.y<0.0)B=-C.y;
            gl_FragColor=vec4(0.5*(R-L+T-B),0.0,0.0,1.0); }`;

        const F_PRES = `precision highp float;
          varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uPressure,uDivergence;
          void main(){
            float L=texture2D(uPressure,vL).x, R=texture2D(uPressure,vR).x;
            float T=texture2D(uPressure,vT).x, B=texture2D(uPressure,vB).x;
            float pressure=(L+R+B+T-texture2D(uDivergence,vUv).x)*0.25;
            gl_FragColor=vec4(pressure,0.0,0.0,1.0); }`;

        const F_GSUB = `precision highp float;
          varying vec2 vUv,vL,vR,vT,vB; uniform sampler2D uPressure,uVelocity;
          void main(){
            float L=texture2D(uPressure,vL).x, R=texture2D(uPressure,vR).x;
            float T=texture2D(uPressure,vT).x, B=texture2D(uPressure,vB).x;
            vec2 vel=texture2D(uVelocity,vUv).xy; vel-=vec2(R-L,T-B);
            gl_FragColor=vec4(vel,0.0,1.0); }`;

        // composite.frag logic — bg color updated each frame via uniform
        const F_DISP = `precision highp float;
          varying vec2 vUv; uniform sampler2D uTexture; uniform vec3 uBg;
          void main(){
            vec3 c=texture2D(uTexture,vUv).rgb;
            float intensity=min(length(c)*5.0,1.0);
            gl_FragColor=vec4(mix(uBg,c,intensity),1.0); }`;

        const pAdv  = mkProg(V_UV,     F_ADV);
        const pClr  = mkProg(V_UV,     F_CLEAR);
        const pSpl  = mkProg(V_UV,     F_SPLAT);
        const pCurl = mkProg(V_UV_OFF, F_CURL);
        const pVort = mkProg(V_UV_OFF, F_VORT);
        const pDiv  = mkProg(V_UV_OFF, F_DIV);
        const pPres = mkProg(V_UV_OFF, F_PRES);
        const pGsub = mkProg(V_UV_OFF, F_GSUB);
        const pDisp = mkProg(V_UV,     F_DISP);

        // Fullscreen quad
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,-1,1,1,1,1,-1]), gl.STATIC_DRAW);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0,1,2,0,2,3]), gl.STATIC_DRAW);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(0);

        function blit(target) {
          if (target === null) { gl.viewport(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight); gl.bindFramebuffer(gl.FRAMEBUFFER,null); }
          else                 { gl.viewport(0,0,target.w,target.h); gl.bindFramebuffer(gl.FRAMEBUFFER,target.fbo); }
          gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        }

        function mkFBO(w, h, ifmt, fmt, filt) {
          const tex = gl.createTexture();
          gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filt);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filt);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
          gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
          gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, HF, null);
          const fbo = gl.createFramebuffer();
          gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
          gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
          gl.viewport(0,0,w,h); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
          return { fbo, tex, w, h, attach(id){ gl.activeTexture(gl.TEXTURE0+id); gl.bindTexture(gl.TEXTURE_2D,tex); return id; } };
        }
        function mkDouble(w, h, ifmt, fmt, filt) {
          let a = mkFBO(w,h,ifmt,fmt,filt), b = mkFBO(w,h,ifmt,fmt,filt);
          return { get read(){return a;}, get write(){return b;}, swap(){ const t=a; a=b; b=t; }, w, h };
        }

        const vel  = mkDouble(SIM, SIM, FMT_RG.i,   FMT_RG.f,   gl.LINEAR);
        const dye  = mkDouble(DYE, DYE, FMT_RGBA.i, FMT_RGBA.f, gl.LINEAR);
        const curl = mkFBO(SIM, SIM, FMT_R.i, FMT_R.f, gl.NEAREST);
        const div  = mkFBO(SIM, SIM, FMT_R.i, FMT_R.f, gl.NEAREST);
        const pres = mkDouble(SIM, SIM, FMT_R.i, FMT_R.f, gl.NEAREST);

        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        // Mouse — pixel-space deltas like library's usePointer.tsx
        const mouse = { x:0, y:0, dx:0, dy:0, moved:false, init:false };
        const onMove = e => {
          const dx = e.clientX - mouse.x, dy = e.clientY - mouse.y;
          mouse.x = e.clientX; mouse.y = e.clientY;
          if (!mouse.init) { mouse.init = true; return; }
          mouse.dx = dx * FORCE; mouse.dy = -dy * FORCE;
          mouse.moved = true;
        };
        window.addEventListener('mousemove', onMove);

        function splat(x, y, dx, dy) {
          const ar = canvas.width / canvas.height;
          const nx = x / canvas.width, ny = 1.0 - y / canvas.height;
          // derive rainbow color from velocity direction (matches library rainbow:true + velocity color)
          const angle = Math.atan2(dy, dx);
          const col = fluidColor(angle);
          pSpl.use();
          gl.uniform1f(pSpl.u.aspectRatio, ar);
          gl.uniform2f(pSpl.u.uPointer, nx, ny);
          gl.uniform1f(pSpl.u.uRadius, RADIUS);
          // velocity splat
          gl.uniform1i(pSpl.u.uTarget, vel.read.attach(0));
          gl.uniform3f(pSpl.u.uColor, dx, dy, 0);
          blit(vel.write); vel.swap();
          // dye splat — HSV color from movement direction
          gl.uniform1i(pSpl.u.uTarget, dye.read.attach(0));
          gl.uniform3f(pSpl.u.uColor, col[0], col[1], col[2]);
          blit(dye.write); dye.swap();
        }

        function step() {
          gl.disable(gl.BLEND);
          const ar = canvas.width / canvas.height;
          const tsx = 1.0 / (SIM * ar), tsy = 1.0 / SIM;

          pCurl.use();
          gl.uniform2f(pCurl.u.texelSize, tsx, tsy);
          gl.uniform1i(pCurl.u.uVelocity, vel.read.attach(0));
          blit(curl);

          pVort.use();
          gl.uniform2f(pVort.u.texelSize, tsx, tsy);
          gl.uniform1i(pVort.u.uVelocity, vel.read.attach(0));
          gl.uniform1i(pVort.u.uCurl, curl.attach(1));
          gl.uniform1f(pVort.u.uCurlValue, CURL_V);
          gl.uniform1f(pVort.u.dt, DT);
          blit(vel.write); vel.swap();

          pDiv.use();
          gl.uniform2f(pDiv.u.texelSize, tsx, tsy);
          gl.uniform1i(pDiv.u.uVelocity, vel.read.attach(0));
          blit(div);

          pClr.use();
          gl.uniform1i(pClr.u.uTexture, pres.read.attach(0));
          gl.uniform1f(pClr.u.uClearValue, PRESSURE);
          blit(pres.write); pres.swap();

          pPres.use();
          gl.uniform2f(pPres.u.texelSize, tsx, tsy);
          gl.uniform1i(pPres.u.uDivergence, div.attach(0));
          for (let i = 0; i < SWIRL; i++) {
            gl.uniform1i(pPres.u.uPressure, pres.read.attach(1));
            blit(pres.write); pres.swap();
          }

          pGsub.use();
          gl.uniform2f(pGsub.u.texelSize, tsx, tsy);
          gl.uniform1i(pGsub.u.uPressure, pres.read.attach(0));
          gl.uniform1i(pGsub.u.uVelocity, vel.read.attach(1));
          blit(vel.write); vel.swap();

          pAdv.use();
          gl.uniform2f(pAdv.u.texelSize, tsx, tsy);
          gl.uniform1f(pAdv.u.dt, DT);
          // advect velocity
          gl.uniform1i(pAdv.u.uVelocity, vel.read.attach(0));
          gl.uniform1i(pAdv.u.uSource,   vel.read.attach(0));
          gl.uniform1f(pAdv.u.uDissipation, VEL_DISS);
          blit(vel.write); vel.swap();
          // advect dye
          gl.uniform1i(pAdv.u.uVelocity, vel.read.attach(0));
          gl.uniform1i(pAdv.u.uSource,   dye.read.attach(1));
          gl.uniform1f(pAdv.u.uDissipation, DYE_DISS);
          blit(dye.write); dye.swap();
        }

        function render() {
          gl.disable(gl.BLEND);
          pDisp.use();
          gl.uniform1i(pDisp.u.uTexture, dye.read.attach(0));
          // pass current bg color so night mode transition is seamless
          const bg = nightRef.current ? [28/255, 18/255, 10/255] : [250/255, 225/255, 195/255];
          gl.uniform3f(pDisp.u.uBg, bg[0], bg[1], bg[2]);
          blit(null);
        }

        let animId;
        function update() {
          if (mouse.moved) {
            mouse.moved = false;
            splat(mouse.x, mouse.y, mouse.dx, mouse.dy);
          }
          step(); render();
          animId = requestAnimationFrame(update);
        }
        update();

        let resizeTimer;
        const onResize = () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }, 100); };
        window.addEventListener('resize', onResize);

        return () => {
          cancelAnimationFrame(animId); clearTimeout(resizeTimer);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('resize', onResize);
        };
      }, []);

      return (
        <canvas ref={canvasRef} style={{ position:'fixed', top:0, left:0, width:'100%', height:'100%', zIndex:-1, pointerEvents:'none' }} />
      );
    };


    /* =====================
       COMPONENTS
       ===================== */
    const Tag = ({ label }) => {
      const C = useContext(ColorCtx);
      return (
      <span
        style={{
          display: "inline-block",
          padding: "3px 10px",
          borderRadius: "9999px",
          background: C.tagBg,
          color: C.accent,
          fontSize: "12px",
          fontWeight: 500,
          border: `1px solid ${C.tagBorder}`,
          marginRight: "6px",
          marginBottom: "6px",
        }}
      >
        {label}
      </span>
    );
    };

    const SectionHeading = ({ children, id }) => {
      const C = useContext(ColorCtx);
      return (
      <div id={id} style={{ paddingTop: "80px", marginBottom: "28px" }}>
        <h2
          style={{
            fontSize: "20px",
            fontWeight: 700,
            color: C.textDark,
            letterSpacing: "-0.02em",
            paddingBottom: "12px",
            borderBottom: `2px solid ${C.border}`,
          }}
        >
          {children}
        </h2>
      </div>
    );
    };

    const ExperienceCard = ({ item }) => {
      const C = useContext(ColorCtx);
      const card = makeCard(C);
      return (
      <div style={card}>
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            flexWrap: "wrap",
            gap: "8px",
            marginBottom: "12px",
          }}
        >
          <div>
            <div style={{ fontSize: "16px", fontWeight: 600, color: C.textDark }}>
              {item.role}
            </div>
            <div style={{ fontSize: "13px", color: C.accent, fontWeight: 500, marginTop: "2px" }}>
              {item.company}
            </div>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: "13px", color: C.textMuted }}>{item.dates}</div>
            <div style={{ fontSize: "12px", color: C.textLight }}>{item.location}</div>
          </div>
        </div>
        <ul style={{ paddingLeft: "18px" }}>
          {item.bullets.map((b, i) => (
            <li
              key={i}
              style={{ fontSize: "14px", color: C.textBody, marginBottom: "5px", lineHeight: "1.65" }}
            >
              {b}
            </li>
          ))}
        </ul>
      </div>
    );
    };

    const ProjectCard = ({ item }) => {
      const C = useContext(ColorCtx);
      const card = makeCard(C);
      return (
      <div style={card}>
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "flex-start",
            marginBottom: "10px",
          }}
        >
          <div style={{ fontSize: "16px", fontWeight: 600, color: C.textDark }}>{item.name}</div>
          {item.link && (
            <a
              href={item.link}
              target="_blank"
              rel="noreferrer"
              style={{
                fontSize: "13px",
                color: C.accent,
                textDecoration: "none",
                flexShrink: 0,
                marginLeft: "16px",
              }}
            >
              GitHub →
            </a>
          )}
        </div>
        <p style={{ fontSize: "14px", color: C.textBody, lineHeight: "1.7", marginBottom: "14px" }}>
          {item.description}
        </p>
        <div style={{ display: "flex", flexWrap: "wrap" }}>
          {item.tech.map((t, i) => (
            <Tag key={i} label={t} />
          ))}
        </div>
      </div>
    );
    };

    const Navbar = ({ night, onToggleNight }) => {
      const C = useContext(ColorCtx);
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 50);
        window.addEventListener("scroll", onScroll);
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const links = ["About", "Experience", "Skills", "Education", "Projects"];
      return (
        <nav
          style={{
            position: "fixed",
            top: 0,
            left: 0,
            right: 0,
            zIndex: 100,
            background: scrolled ? C.bgNavScrolled : "transparent",
            backdropFilter: scrolled ? "blur(10px)" : "none",
            borderBottom: scrolled ? `1px solid ${C.border}` : "1px solid transparent",
            transition: "all 0.2s",
            padding: "0 40px",
            height: "60px",
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
          }}
        >
          <a
            href="../"
            style={{
              fontSize: "13px",
              color: C.textLight,
              textDecoration: "none",
              fontWeight: 500,
              letterSpacing: "0.02em",
            }}
          >
            ← Back
          </a>
          <div style={{ display: "flex", alignItems: "center", gap: "28px" }}>
            {links.map((l) => (
              <NavLink key={l} href={`#${l.toLowerCase()}`} label={l} />
            ))}
            <button
              onClick={onToggleNight}
              title={night ? "Switch to day mode" : "Switch to night mode"}
              style={{
                background: "none",
                border: `1px solid ${C.border}`,
                borderRadius: "6px",
                padding: "4px 10px",
                cursor: "pointer",
                fontSize: "13px",
                color: C.textMuted,
                fontFamily: "inherit",
                transition: "color 0.15s, border-color 0.15s",
              }}
            >
              {night ? "☀ Day" : "☾ Night"}
            </button>
          </div>
        </nav>
      );
    };

    const NavLink = ({ href, label }) => {
      const C = useContext(ColorCtx);
      const [hovered, setHovered] = useState(false);
      return (
        <a
          href={href}
          style={{
            fontSize: "13px",
            color: hovered ? C.accent : C.textMuted,
            textDecoration: "none",
            fontWeight: 500,
            transition: "color 0.15s",
          }}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          {label}
        </a>
      );
    };

    const Hero = () => {
      const C = useContext(ColorCtx);
      return (
      <section
        style={{
          minHeight: "100vh",
          display: "flex",
          flexDirection: "column",
          justifyContent: "center",
          padding: "60px 0 40px",
        }}
      >
        <div
          style={{
            fontSize: "12px",
            color: C.accent,
            fontWeight: 600,
            letterSpacing: "0.1em",
            textTransform: "uppercase",
            marginBottom: "20px",
          }}
        >
          Portfolio
        </div>
        <h1
          style={{
            fontSize: "clamp(44px, 7vw, 76px)",
            fontWeight: 700,
            color: C.textDark,
            letterSpacing: "-0.04em",
            lineHeight: 1.05,
            marginBottom: "16px",
          }}
        >
          {DATA.name}
        </h1>
        <div
          style={{
            fontSize: "clamp(18px, 2.5vw, 26px)",
            color: C.textMuted,
            fontWeight: 300,
            marginBottom: "20px",
          }}
        >
          {DATA.title}
        </div>
        <p
          style={{
            fontSize: "17px",
            color: C.textMuted,
            maxWidth: "520px",
            lineHeight: "1.75",
            marginBottom: "40px",
          }}
        >
          {DATA.tagline}
        </p>
        <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", alignItems: "center" }}>
          <ContactLink href={`mailto:${DATA.contact.email}`} label={DATA.contact.email} />
          <Dot />
          <ContactLink href={`https://github.com/${DATA.contact.github}`} label="GitHub" external />
          <Dot />
          <ContactLink href={`https://linkedin.com/in/${DATA.contact.linkedin}`} label="LinkedIn" external />
          <Dot />
          <span style={{ fontSize: "13px", color: C.textLight }}>{DATA.contact.location}</span>
        </div>
      </section>
    );
    };

    const Dot = () => {
      const C = useContext(ColorCtx);
      return <span style={{ color: C.dot, fontSize: "14px", userSelect: "none" }}>·</span>;
    };

    const ContactLink = ({ href, label, external }) => {
      const C = useContext(ColorCtx);
      const [hovered, setHovered] = useState(false);
      return (
        <a
          href={href}
          target={external ? "_blank" : undefined}
          rel={external ? "noreferrer" : undefined}
          style={{
            fontSize: "13px",
            color: hovered ? C.accent : C.textBody,
            textDecoration: "none",
            fontWeight: 500,
            transition: "color 0.15s",
          }}
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
        >
          {label}
        </a>
      );
    };

    const App = () => {
      const [night, setNight] = useState(true);
      const C = night ? NIGHT : DAY;
      const card = makeCard(C);

      useEffect(() => {
        document.body.style.background = C.bg;
        document.body.style.transition = "background 0.3s";
      }, [night]);

      return (
        <ColorCtx.Provider value={C}>
          <>
            <BackgroundCanvas night={night} />
            <Navbar night={night} onToggleNight={() => setNight(n => !n)} />
            <div style={{ maxWidth: "820px", margin: "0 auto", padding: "0 40px 100px" }}>
              <Hero />

              <SectionHeading id="about">About</SectionHeading>
              <div style={{ ...card, fontSize: "15px", color: C.textBody, lineHeight: "1.85" }}>
                {DATA.about}
              </div>

              <SectionHeading id="experience">Experience</SectionHeading>
              {DATA.experience.map((item, i) => (
                <ExperienceCard key={i} item={item} />
              ))}

              <SectionHeading id="skills">Skills</SectionHeading>
              <div style={card}>
                {Object.entries(DATA.skills).map(([category, items]) => (
                  <div key={category} style={{ marginBottom: "20px" }}>
                    <div
                      style={{
                        fontSize: "11px",
                        fontWeight: 600,
                        color: C.textLight,
                        textTransform: "uppercase",
                        letterSpacing: "0.08em",
                        marginBottom: "10px",
                      }}
                    >
                      {category}
                    </div>
                    <div style={{ display: "flex", flexWrap: "wrap" }}>
                      {items.map((s, i) => (
                        <Tag key={i} label={s} />
                      ))}
                    </div>
                  </div>
                ))}
              </div>

              <SectionHeading id="education">Education</SectionHeading>
              {DATA.education.map((item, i) => (
                <div
                  key={i}
                  style={{
                    ...card,
                    display: "flex",
                    justifyContent: "space-between",
                    flexWrap: "wrap",
                    gap: "8px",
                  }}
                >
                  <div>
                    <div style={{ fontSize: "16px", fontWeight: 600, color: C.textDark }}>
                      {item.school}
                    </div>
                    <div style={{ fontSize: "13px", color: C.accent, fontWeight: 500, marginTop: "4px" }}>
                      {item.degree}
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: "13px", color: C.textMuted }}>{item.dates}</div>
                    <div style={{ fontSize: "12px", color: C.textLight }}>GPA: {item.gpa}</div>
                  </div>
                </div>
              ))}

              <SectionHeading id="projects">Projects</SectionHeading>
              {DATA.projects.map((item, i) => (
                <ProjectCard key={i} item={item} />
              ))}

              <footer
                style={{
                  marginTop: "80px",
                  paddingTop: "28px",
                  borderTop: `1px solid ${C.border}`,
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  flexWrap: "wrap",
                  gap: "8px",
                }}
              >
                <span style={{ fontSize: "12px", color: C.textLight }}>{DATA.name}</span>
                <a href="../" style={{ fontSize: "12px", color: C.textLight, textDecoration: "none" }}>
                  ← Back to home
                </a>
              </footer>
            </div>
          </>
        </ColorCtx.Provider>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
