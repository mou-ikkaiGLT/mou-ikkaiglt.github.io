<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoeGLT04</title>
  <link rel="icon" type="image/png" href="Icons/FullCup.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #1c120a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .cards {
      display: flex;
      gap: 40px;
      align-items: center;
    }

    .card {
      width: 260px;
      height: 340px;
      background: #24190f;
      border: 1px solid #412e1e;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.25s, transform 0.25s, background 0.25s, box-shadow 0.25s;
    }

    .card:hover {
      border-color: #ae6a38;
      background: #2d1e10;
      transform: translateY(-6px);
      box-shadow: 0 20px 60px rgba(174, 106, 56, 0.15);
    }

    /* PDF / document icon */
    .doc-icon {
      width: 90px;
      height: 116px;
      position: relative;
    }

    .doc-icon svg {
      width: 100%;
      height: 100%;
    }

    .card-info {
      text-align: center;
    }

    .card-label {
      color: #fae1c3;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .card-sub {
      color: #826448;
      font-size: 11px;
      letter-spacing: 0.06em;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="cards">

    <!-- Option 1: Resume -->
    <a class="card" href="resume/">
      <div class="doc-icon">
        <svg viewBox="0 0 90 116" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 6C0 2.686 2.686 0 6 0H62L90 28V110C90 113.314 87.314 116 84 116H6C2.686 116 0 113.314 0 110V6Z" fill="#2d1e10"/>
          <path d="M62 0L90 28H68C64.686 28 62 25.314 62 22V0Z" fill="#3a2614"/>
          <path d="M62 0L90 28H68C64.686 28 62 25.314 62 22V0Z" stroke="#412e1e" stroke-width="1"/>
          <path d="M0 6C0 2.686 2.686 0 6 0H62L90 28V110C90 113.314 87.314 116 84 116H6C2.686 116 0 113.314 0 110V6Z" stroke="#412e1e" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="card-info">
        <div class="card-label">Resume</div>
        <div class="card-sub">Professional</div>
      </div>
    </a>

    <!-- Option 2: Desktop -->
    <a class="card" href="desktop.html">
      <div class="doc-icon">
        <svg viewBox="0 0 90 116" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 6C0 2.686 2.686 0 6 0H62L90 28V110C90 113.314 87.314 116 84 116H6C2.686 116 0 113.314 0 110V6Z" fill="#2d1e10"/>
          <path d="M62 0L90 28H68C64.686 28 62 25.314 62 22V0Z" fill="#3a2614"/>
          <path d="M62 0L90 28H68C64.686 28 62 25.314 62 22V0Z" stroke="#412e1e" stroke-width="1"/>
          <path d="M0 6C0 2.686 2.686 0 6 0H62L90 28V110C90 113.314 87.314 116 84 116H6C2.686 116 0 113.314 0 110V6Z" stroke="#412e1e" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="card-info">
        <div class="card-label">Desktop</div>
        <div class="card-sub">Interactive</div>
      </div>
    </a>

  </div>
</body>
</html>
